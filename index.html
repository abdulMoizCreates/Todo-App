<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Todo App</title>
</head>

<body>
    <div class="main">

        <div class="sidePanel">
            <div class="list">
                <div class="listOptions">
                    <h4 class="listOption">
                        <span class="listOptionText">All Tasks</span>
                        <span class="listOptionNumber">12</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Today</span>
                        <span class="listOptionNumber">5</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Upcoming</span>
                        <span class="listOptionNumber">4</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Completed</span>
                        <span class="listOptionNumber">18</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Trash</span>
                        <span class="listOptionNumber">2</span>
                    </h4>
                </div>
            </div>
            <div class="quoteArea">
                <q>Simplicity is the Ultimate Sophistication.</q>
                <b>- Leonardo Da Vinci</b>
            </div>
            <div class="modeOptions">
                <p>Light Mode</p>
                <p>Dark Mode</p>
            </div>
        </div>

        <div class="task">
            <div class="taskSection"></div>
            <div class="taskFilters"></div>
            <div class="taskList"></div>
        </div>

    </div>

    <script src="assets/js/app.js"></script>
</body>

</html>
