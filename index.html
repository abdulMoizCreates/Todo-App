<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Todo App</title>
</head>

<body>
    <div class="main">

        <div class="sidePanel">
            <div class="list">
                <div class="listOptions">
                    <h4 class="listOption">
                        <span class="listOptionText">All Tasks</span>
                        <span class="listOptionNumber">12</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Today</span>
                        <span class="listOptionNumber">5</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Upcoming</span>
                        <span class="listOptionNumber">4</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Completed</span>
                        <span class="listOptionNumber">18</span>
                    </h4>
                    <h4 class="listOption">
                        <span class="listOptionText">Trash</span>
                        <span class="listOptionNumber">2</span>
                    </h4>
                </div>
            </div>
            <div class="quoteArea">
                <q>Simplicity is the Ultimate Sophistication.</q>
                <b>- Leonardo Da Vinci</b>
            </div>
            <div class="modeOptions">
                <p>Light Mode</p>
                <p>Dark Mode</p>
            </div>
        </div>

        <div class="todos">
            <div class="mainHeading">
                <h1>Todo App</h1>
            </div>
            <div class="addTodoSection">

                <!-- Search and adding todos: -->
                <input type="text" class="searchBar" placeholder="Add/Search Todos">
                <button class="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="addBtn">
                    <i class="fa-solid fa-plus"></i>
                </button>

            </div>
            <div class="todoFilters">
                <div class="filterBtns">
                    <button class="filterBtn all buttonIsActive">All</button>
                    <button class="filterBtn Pending">Pending</button>
                    <button class="filterBtn completed">Conmpleted</button>
                </div>
                <div class="filterSortList">
                    <span class="listOptionNumber">Sort by:</span>
                    <select name="" id="">
                        <option value="">name</option>
                        <option value="">Date Created</option>
                        
                    </select>
                </div>
            </div>
            <div class="todoList">
                <ul>
                    <li>
                        <input type="checkbox" class="todoCheck">
                        <p class="todoTask">read Books to develope Mindset</p>
                        <button class="todoListBtn">
                            <i class="fa-solid fa-pencil"></i>
                        </button>
                        <button class="todoListBtn">
                            <i class="fa-solid fa-x"></i>
                        </button>
                    </li>
                    <li>
                        <input type="checkbox" class="todoCheck">
                        <p class="todoTask">read Books to develope Mindset</p>
                        <button class="todoListBtn">
                            <i class="fa-solid fa-pencil"></i>
                        </button>
                        <button class="todoListBtn">
                            <i class="fa-solid fa-x"></i>
                        </button>
                    </li>
                </ul>
                <!-- JavaScript Rendering will be done here -->
            </div>
        </div>

    </div>

    <script src="assets/js/app.js"></script>
</body>

</html>
